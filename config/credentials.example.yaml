# config/credentials.example.yaml
#
# Copy this file to a location OUTSIDE the installed package (see
# docs/DEPLOYMENT.md — credentials must survive upgrades and must never be
# baked into the package or committed to version control) and fill in the
# five fields below from your registered application at
# https://developer.dji.com/user/apps/#all
#
# This example file intentionally contains no real values. Do not commit a
# filled-in copy of this file anywhere.

app_name: "your_app_name"
app_id: "your_app_id"
app_key: "your_app_key"
app_license: "your_app_license"
developer_account: "your_developer_account_email"
baud_rate: "921600"
