<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" font-family="Arial, Helvetica, sans-serif">
  <rect width="1180" height="830" fill="#ffffff"/>
  <style>
    .box { fill: #f4f7fb; stroke: #3d5a80; stroke-width: 2.5; rx: 10; }
    .chip { fill: #fdf4e7; stroke: #b5651d; }
    .kit { fill: #eef3ea; stroke: #2f6b3a; }
    .pi { fill: #fdfdfd; stroke: #3d5a80; }
    .title { font-size: 24px; font-weight: bold; fill: #1d3557; }
    .sub { font-size: 17.5px; fill: #33415c; }
    .port { font-size: 17px; font-weight: bold; fill: #33415c; }
    .pin { font-size: 17.5px; fill: #1d3557; font-weight: bold; }
    .pinname { font-size: 17px; fill: #33415c; }
    .lg { font-size: 17px; fill: #33415c; }
  </style>

  <!-- ===================== Matrice 4T ===================== -->
  <rect class="box kit" x="40" y="80" width="250" height="150" rx="10"/>
  <text class="title" x="165" y="120" text-anchor="middle">Matrice 4T</text>
  <rect x="230" y="140" width="60" height="40" rx="6" fill="#ffffff" stroke="#2f6b3a" stroke-width="2"/>
  <text class="sub" x="260" y="165" text-anchor="middle">E-Port</text>
  <text class="sub" x="165" y="205" text-anchor="middle">(powered off while wiring)</text>

  <!-- coaxial cable -->
  <line x1="290" y1="160" x2="320" y2="160" stroke="#555" stroke-width="9"/>
  <line x1="290" y1="160" x2="320" y2="160" stroke="#999" stroke-width="5"/>

  <!-- ===================== E-Port dev kit ===================== -->
  <rect class="box" x="320" y="80" width="300" height="210" rx="10"/>
  <text class="title" x="446" y="115" text-anchor="middle">E-Port Development Kit</text>
  <text class="sub" x="446" y="142" text-anchor="middle">USB mode switch = Host</text>
  <text class="sub" x="446" y="164" text-anchor="middle">E-Port dip switch = ON</text>
  <!-- ports on the right edge: label inside, wire starts at edge dot -->
  <text class="port" x="596" y="128" text-anchor="end">TX</text>
  <text class="port" x="596" y="172" text-anchor="end">RX</text>
  <text class="port" x="596" y="216" text-anchor="end">GND</text>
  <text class="port" x="596" y="260" text-anchor="end">5 V</text>
  <circle cx="612" cy="123" r="5" fill="#1d6fd1"/>
  <circle cx="612" cy="167" r="5" fill="#0f9d8f"/>
  <circle cx="612" cy="211" r="5" fill="#222222"/>
  <circle cx="612" cy="255" r="5" fill="#c1121f"/>

  <!-- ===================== SDK certified chip ===================== -->
  <rect class="box chip" x="320" y="430" width="300" height="270" rx="10"/>
  <text class="title" x="470" y="465" text-anchor="middle">SDK Certified Chip</text>
  <text class="sub" x="470" y="490" text-anchor="middle">I2C @ 0x2A, required on Matrice 4</text>
  <text class="port" x="596" y="525" text-anchor="end">VCC</text>
  <text class="port" x="596" y="560" text-anchor="end">GND</text>
  <text class="port" x="596" y="595" text-anchor="end">I2C_SDA</text>
  <text class="port" x="596" y="630" text-anchor="end">I2C_SCL</text>
  <text class="port" x="596" y="665" text-anchor="end">NRST</text>
  <circle cx="612" cy="520" r="5" fill="#e07a1f"/>
  <circle cx="612" cy="555" r="5" fill="#222222"/>
  <circle cx="612" cy="590" r="5" fill="#7b2cbf"/>
  <circle cx="612" cy="625" r="5" fill="#c9184a"/>
  <circle cx="612" cy="660" r="5" fill="#6b7f2a"/>

  <!-- ===================== Drop kit ===================== -->
  <line x1="165" y1="230" x2="165" y2="445" stroke="#2f6b3a" stroke-width="3.5"/>
  <polygon points="165,445 158,428 172,428" fill="#2f6b3a"/>
  <text class="sub" x="178" y="345">aircraft port</text>
  <rect class="box kit" x="40" y="445" width="250" height="140" rx="10"/>
  <text class="title" x="165" y="482" text-anchor="middle">Drop kit</text>
  <text class="sub" x="165" y="508" text-anchor="middle">on the aircraft —</text>
  <text class="sub" x="165" y="530" text-anchor="middle">E-Port Lite or battery</text>
  <text class="sub" x="165" y="552" text-anchor="middle">USB-C, kit dependent</text>

  <!-- ===================== Raspberry Pi ===================== -->
  <rect class="box pi" x="850" y="60" width="300" height="600" rx="10"/>
  <text class="title" x="1000" y="92" text-anchor="middle">Raspberry Pi Zero 2 W</text>
  <text class="sub" x="1000" y="114" text-anchor="middle">header pins used (1–10)</text>

  <!-- pin pads: y = 128 + i*52 -->
  <!-- pin 1 -->
  <rect x="870" y="128" width="260" height="34" rx="6" fill="#fff4e0" stroke="#e07a1f" stroke-width="2"/>
  <circle cx="886" cy="145" r="5" fill="#e07a1f"/>
  <text class="pin" x="898" y="150">1</text>
  <text class="pinname" x="922" y="150">3.3 V — chip VCC</text>
  <!-- pin 2 -->
  <rect x="870" y="180" width="260" height="34" rx="6" fill="#ffe9e9" stroke="#c1121f" stroke-width="2"/>
  <circle cx="886" cy="197" r="5" fill="#c1121f"/>
  <text class="pin" x="898" y="202">2</text>
  <text class="pinname" x="922" y="202">5 V — kit 5 V output</text>
  <!-- pin 3 -->
  <rect x="870" y="232" width="260" height="34" rx="6" fill="#f1e8fb" stroke="#7b2cbf" stroke-width="2"/>
  <circle cx="886" cy="249" r="5" fill="#7b2cbf"/>
  <text class="pin" x="898" y="254">3</text>
  <text class="pinname" x="922" y="254">GPIO2 (SDA) — chip SDA</text>
  <!-- pin 5 -->
  <rect x="870" y="284" width="260" height="34" rx="6" fill="#fbe6ef" stroke="#c9184a" stroke-width="2"/>
  <circle cx="886" cy="301" r="5" fill="#c9184a"/>
  <text class="pin" x="898" y="306">5</text>
  <text class="pinname" x="922" y="306">GPIO3 (SCL) — chip SCL</text>
  <!-- pin 6 -->
  <rect x="870" y="336" width="260" height="34" rx="6" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
  <circle cx="886" cy="353" r="5" fill="#222222"/>
  <text class="pin" x="898" y="358">6</text>
  <text class="pinname" x="922" y="358">GND — kit GND</text>
  <!-- pin 7 -->
  <rect x="870" y="388" width="260" height="34" rx="6" fill="#eef2dd" stroke="#6b7f2a" stroke-width="2"/>
  <circle cx="886" cy="405" r="5" fill="#6b7f2a"/>
  <text class="pin" x="898" y="410">7</text>
  <text class="pinname" x="922" y="410">GPIO4 — chip NRST</text>
  <!-- pin 8 -->
  <rect x="870" y="440" width="260" height="34" rx="6" fill="#ddf3f1" stroke="#0f9d8f" stroke-width="2"/>
  <circle cx="886" cy="457" r="5" fill="#0f9d8f"/>
  <text class="pin" x="898" y="462">8</text>
  <text class="pinname" x="922" y="462">GPIO14 (TXD) — kit RX</text>
  <!-- pin 9 -->
  <rect x="870" y="492" width="260" height="34" rx="6" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
  <circle cx="886" cy="509" r="5" fill="#222222"/>
  <text class="pin" x="898" y="514">9</text>
  <text class="pinname" x="922" y="514">GND — chip GND</text>
  <!-- pin 10 -->
  <rect x="870" y="544" width="260" height="34" rx="6" fill="#e0ecfb" stroke="#1d6fd1" stroke-width="2"/>
  <circle cx="886" cy="561" r="5" fill="#1d6fd1"/>
  <text class="pin" x="898" y="566">10</text>
  <text class="pinname" x="930" y="566">GPIO15 (RXD) — kit TX</text>

  <text class="sub" x="1000" y="615" text-anchor="middle">TX and RX cross over</text>
  <text class="sub" x="1000" y="640" text-anchor="middle">— all grounds are common</text>

  <!-- ===================== wires: dev kit -> pi ===================== -->
  <path d="M 617 123 C 735 123, 735 561, 870 561" fill="none" stroke="#1d6fd1" stroke-width="3.5"/>
  <path d="M 617 167 C 730 167, 730 457, 870 457" fill="none" stroke="#0f9d8f" stroke-width="3.5"/>
  <path d="M 617 211 C 725 211, 725 353, 870 353" fill="none" stroke="#222222" stroke-width="3.5"/>
  <path d="M 617 255 C 720 255, 720 197, 870 197" fill="none" stroke="#c1121f" stroke-width="3.5"/>

  <!-- ===================== wires: chip -> pi ===================== -->
  <path d="M 617 520 C 700 520, 760 145, 870 145" fill="none" stroke="#e07a1f" stroke-width="3.5"/>
  <path d="M 617 555 C 720 555, 760 509, 870 509" fill="none" stroke="#222222" stroke-width="3.5"/>
  <path d="M 617 590 C 700 590, 760 249, 870 249" fill="none" stroke="#7b2cbf" stroke-width="3.5"/>
  <path d="M 617 625 C 705 625, 765 301, 870 301" fill="none" stroke="#c9184a" stroke-width="3.5"/>
  <path d="M 617 660 C 710 660, 770 405, 870 405" fill="none" stroke="#6b7f2a" stroke-width="3.5"/>

  <!-- ===================== legend ===================== -->
  <rect x="40" y="715" width="740" height="105" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="1"/>
  <text class="title" x="60" y="742" font-size="16">Wire colours</text>
  <line x1="60" y1="765" x2="95" y2="765" stroke="#c1121f" stroke-width="4"/><text class="lg" x="103" y="770">5 V power</text>
  <line x1="60" y1="795" x2="95" y2="795" stroke="#e07a1f" stroke-width="4"/><text class="lg" x="103" y="800">3.3 V (chip VCC)</text>
  <line x1="280" y1="765" x2="315" y2="765" stroke="#222222" stroke-width="4"/><text class="lg" x="323" y="770">GND</text>
  <line x1="280" y1="795" x2="315" y2="795" stroke="#6b7f2a" stroke-width="4"/><text class="lg" x="323" y="800">NRST (reset)</text>
  <line x1="455" y1="765" x2="490" y2="765" stroke="#1d6fd1" stroke-width="4"/><text class="lg" x="498" y="770">kit TX → Pi RXD</text>
  <line x1="455" y1="795" x2="490" y2="795" stroke="#0f9d8f" stroke-width="4"/><text class="lg" x="498" y="800">kit RX → Pi TXD</text>
  <line x1="665" y1="765" x2="700" y2="765" stroke="#7b2cbf" stroke-width="4"/><text class="lg" x="708" y="770">I2C SDA</text>
  <line x1="665" y1="795" x2="700" y2="795" stroke="#c9184a" stroke-width="4"/><text class="lg" x="708" y="800">I2C SCL</text>
</svg>
