<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="Arial, Helvetica, sans-serif">
  <rect width="1160" height="620" fill="#ffffff"/>
  <style>
    .title { font-size: 23px; font-weight: bold; fill: #1d3557; }
    .sub { font-size: 17px; fill: #33415c; }
    .pinnum { font-size: 17px; fill: #556; text-anchor: middle; }
    .padnum { font-size: 19px; font-weight: bold; fill: #1d3557; }
    .padname { font-size: 18px; font-weight: bold; fill: #33415c; }
    .padrole { font-size: 17px; fill: #556; }
  </style>

  <text class="title" x="60" y="46">40-pin header — the nine positions this build uses</text>
  <text class="sub" x="60" y="70">Odd pins on the left column, even on the right; pin 1 is the square pad.</text>

  <!-- ===================== full 2x20 header ===================== -->
  <rect x="140" y="90" width="200" height="500" rx="14" fill="#f4f4f4" stroke="#3d5a80" stroke-width="2.5"/>

  <!-- pin-1 orientation marker -->
  <rect x="152" y="98" width="14" height="14" fill="#3d5a80"/>

  <!-- generated rows: odd x=210, even x=270, y=110+i*26 -->
  <!-- row contents hand-written: used pins get signal colour + white fill -->
  <!-- i=0..19, odd pin = 2i+1, even = 2i+2 -->

  <!-- row 1: pins 1,2 -->
  <circle cx="210" cy="110" r="10" fill="#e07a1f"/><text class="pinnum" x="190" y="114">1</text>
  <circle cx="270" cy="110" r="10" fill="#c1121f"/><text class="pinnum" x="292" y="114">2</text>
  <!-- row 2: pins 3,4 -->
  <circle cx="210" cy="136" r="10" fill="#7b2cbf"/><text class="pinnum" x="190" y="140">3</text>
  <circle cx="270" cy="136" r="10" fill="#cccccc"/><text class="pinnum" x="292" y="140">4</text>
  <!-- row 3: pins 5,6 -->
  <circle cx="210" cy="162" r="10" fill="#c9184a"/><text class="pinnum" x="190" y="166">5</text>
  <circle cx="270" cy="162" r="10" fill="#222222"/><text class="pinnum" x="292" y="166">6</text>
  <!-- row 4: pins 7,8 -->
  <circle cx="210" cy="188" r="10" fill="#6b7f2a"/><text class="pinnum" x="190" y="192">7</text>
  <circle cx="270" cy="188" r="10" fill="#0f9d8f"/><text class="pinnum" x="292" y="192">8</text>
  <!-- row 5: pins 9,10 -->
  <circle cx="210" cy="214" r="10" fill="#222222"/><text class="pinnum" x="190" y="218">9</text>
  <circle cx="270" cy="214" r="10" fill="#1d6fd1"/><text class="pinnum" x="292" y="218">10</text>
  <!-- rows 6-20: pins 11-40, unused -->
  <circle cx="210" cy="240" r="8" fill="#cccccc"/><circle cx="270" cy="240" r="8" fill="#cccccc"/>
  <circle cx="210" cy="266" r="8" fill="#cccccc"/><circle cx="270" cy="266" r="8" fill="#cccccc"/>
  <circle cx="210" cy="292" r="8" fill="#cccccc"/><circle cx="270" cy="292" r="8" fill="#cccccc"/>
  <circle cx="210" cy="318" r="8" fill="#cccccc"/><circle cx="270" cy="318" r="8" fill="#cccccc"/>
  <circle cx="210" cy="344" r="8" fill="#cccccc"/><circle cx="270" cy="344" r="8" fill="#cccccc"/>
  <circle cx="210" cy="370" r="8" fill="#cccccc"/><circle cx="270" cy="370" r="8" fill="#cccccc"/>
  <circle cx="210" cy="396" r="8" fill="#cccccc"/><circle cx="270" cy="396" r="8" fill="#cccccc"/>
  <circle cx="210" cy="422" r="8" fill="#cccccc"/><circle cx="270" cy="422" r="8" fill="#cccccc"/>
  <circle cx="210" cy="448" r="8" fill="#cccccc"/><circle cx="270" cy="448" r="8" fill="#cccccc"/>
  <circle cx="210" cy="474" r="8" fill="#cccccc"/><circle cx="270" cy="474" r="8" fill="#cccccc"/>
  <circle cx="210" cy="500" r="8" fill="#cccccc"/><circle cx="270" cy="500" r="8" fill="#cccccc"/>
  <circle cx="210" cy="526" r="8" fill="#cccccc"/><circle cx="270" cy="526" r="8" fill="#cccccc"/>
  <circle cx="210" cy="552" r="8" fill="#cccccc"/><circle cx="270" cy="552" r="8" fill="#cccccc"/>
  <circle cx="210" cy="578" r="8" fill="#cccccc"/><circle cx="270" cy="578" r="8" fill="#cccccc"/>
  <text class="pinnum" x="190" y="244">11</text><text class="pinnum" x="296" y="582">40</text>
  <text class="sub" x="240" y="608" text-anchor="middle">pins 11–40 unused</text>

  <!-- ===================== detail: the used pins ===================== -->
  <text class="title" x="430" y="110" font-size="17">Pins 1–10 in order</text>

  <!-- rows: y = 140 + i*50 -->
  <rect x="430" y="124" width="700" height="40" rx="8" fill="#fff4e0" stroke="#e07a1f" stroke-width="2"/>
  <text class="padnum" x="446" y="151">1</text>
  <text class="padname" x="480" y="151">3.3 V</text>
  <text class="padrole" x="700" y="151">certified chip VCC</text>

  <rect x="430" y="174" width="700" height="40" rx="8" fill="#ffe9e9" stroke="#c1121f" stroke-width="2"/>
  <text class="padnum" x="446" y="201">2</text>
  <text class="padname" x="480" y="201">5 V</text>
  <text class="padrole" x="700" y="201">E-Port kit 5 V output</text>

  <rect x="430" y="224" width="700" height="40" rx="8" fill="#f1e8fb" stroke="#7b2cbf" stroke-width="2"/>
  <text class="padnum" x="446" y="251">3</text>
  <text class="padname" x="480" y="251">GPIO2 (SDA)</text>
  <text class="padrole" x="700" y="251">certified chip I2C_SDA</text>

  <rect x="430" y="274" width="700" height="40" rx="8" fill="#fbe6ef" stroke="#c9184a" stroke-width="2"/>
  <text class="padnum" x="446" y="301">5</text>
  <text class="padname" x="480" y="301">GPIO3 (SCL)</text>
  <text class="padrole" x="700" y="301">certified chip I2C_SCL</text>

  <rect x="430" y="324" width="700" height="40" rx="8" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
  <text class="padnum" x="446" y="351">6</text>
  <text class="padname" x="480" y="351">GND</text>
  <text class="padrole" x="700" y="351">E-Port kit GND</text>

  <rect x="430" y="374" width="700" height="40" rx="8" fill="#eef2dd" stroke="#6b7f2a" stroke-width="2"/>
  <text class="padnum" x="446" y="401">7</text>
  <text class="padname" x="480" y="401">GPIO4</text>
  <text class="padrole" x="700" y="401">certified chip NRST (reset)</text>

  <rect x="430" y="424" width="700" height="40" rx="8" fill="#ddf3f1" stroke="#0f9d8f" stroke-width="2"/>
  <text class="padnum" x="446" y="451">8</text>
  <text class="padname" x="480" y="451">GPIO14 (TXD)</text>
  <text class="padrole" x="700" y="451">E-Port kit RX</text>

  <rect x="430" y="474" width="700" height="40" rx="8" fill="#eeeeee" stroke="#222222" stroke-width="2"/>
  <text class="padnum" x="446" y="501">9</text>
  <text class="padname" x="480" y="501">GND</text>
  <text class="padrole" x="700" y="501">certified chip GND</text>

  <rect x="430" y="524" width="700" height="40" rx="8" fill="#e0ecfb" stroke="#1d6fd1" stroke-width="2"/>
  <text class="padnum" x="446" y="551">10</text>
  <text class="padname" x="480" y="551">GPIO15 (RXD)</text>
  <text class="padrole" x="700" y="551">E-Port kit TX</text>
</svg>
