<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" font-family="monospace" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box { fill:#f5f5f5; stroke:#333; stroke-width:1.5; }
    .label { fill:#333; }
    .link { stroke:#333; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    .linklabel { fill:#555; font-size:11px; }
  </style>

  <rect class="box" x="10"  y="90" width="150" height="70" rx="6"/>
  <text class="label" x="30" y="120">Companion</text>
  <text class="label" x="30" y="138">computer</text>
  <text class="label" x="30" y="153">(DropPoint)</text>

  <rect class="box" x="240" y="90" width="150" height="70" rx="6"/>
  <text class="label" x="270" y="120">Aircraft</text>
  <text class="label" x="255" y="138">(FC + camera +</text>
  <text class="label" x="270" y="153">gimbal + LRF)</text>

  <rect class="box" x="470" y="90" width="150" height="70" rx="6"/>
  <text class="label" x="500" y="130">OcuSync</text>
  <text class="label" x="505" y="148">radio link</text>

  <rect class="box" x="700" y="90" width="90" height="70" rx="6"/>
  <text class="label" x="715" y="120">DJI RC</text>
  <text class="label" x="708" y="138">controller</text>

  <rect class="box" x="820" y="90" width="90" height="70" rx="6"/>
  <text class="label" x="845" y="130">Pilot 2</text>
  <text class="label" x="835" y="148">(app)</text>

  <line class="link" x1="160" y1="115" x2="238" y2="115"/>
  <text class="linklabel" x="163" y="105">E-Port / SkyPort V2 /</text>
  <text class="linklabel" x="163" y="90">X-Port / OSDK port</text>
  <text class="linklabel" x="163" y="130">UART: control, telemetry,</text>
  <text class="linklabel" x="163" y="143">widgets, audio, floating window</text>

  <line class="link" x1="160" y1="145" x2="238" y2="145"/>
  <text class="linklabel" x="163" y="165">USB bulk / RNDIS network:</text>
  <text class="linklabel" x="163" y="178">video (for liveview marker only)</text>

  <line class="link" x1="390" y1="120" x2="468" y2="120"/>
  <text class="linklabel" x="395" y="112">video + telemetry</text>

  <line class="link" x1="620" y1="120" x2="698" y2="120"/>
  <line class="link" x1="790" y1="120" x2="818" y2="120"/>
  <text class="linklabel" x="700" y="112">renders widgets,</text>
  <text class="linklabel" x="700" y="185">floating window, audio,</text>
  <text class="linklabel" x="700" y="198">video + AI marker overlay</text>

  <text x="10" y="230" font-weight="bold">Nothing connects to the controller directly.</text>
  <text x="10" y="248">All operator-facing output (widgets, floating window, audio, liveview) travels the aircraft radio link; Pilot renders it.</text>
</svg>
