name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # _GLIBCXX_ASSERTIONS turns libstdc++ precondition violations (e.g.
      # std::normal_distribution with sigma 0) into hard failures on Linux —
      # the same class of checks MSVC's Debug CRT does on Windows.
      - name: Configure (ubuntu — libstdc++ assertions)
        if: matrix.os == 'ubuntu-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-D_GLIBCXX_ASSERTIONS

      - name: Configure (windows)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # MSVC Debug catches precondition violations Release does not (this is
      # how the normal_distribution sigma-0 abort was found). Assertions
      # print to stderr — tests/main.cpp silences the modal dialog.
      - name: Configure Debug (MSVC CRT checks)
        if: matrix.os == 'windows-latest'
        run: cmake -S . -B build-dbg -DCMAKE_BUILD_TYPE=Debug

      - name: Build Debug
        if: matrix.os == 'windows-latest'
        run: cmake --build build-dbg --config Debug --parallel --target droppoint_core_tests

      - name: Test Debug
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build-dbg -C Debug --output-on-failure

  psdk-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone PSDK 3.16.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.16.0 \
            https://github.com/dji-sdk/Payload-SDK third_party/psdk

      # RelWithDebInfo keeps the Release optimisation but adds -g so the gdb
      # fallback below can symbolise a crash.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DDROPPOINT_BUILD_PSDK=ON

      - name: Build
        run: cmake --build build --parallel --target droppoint

      - name: Install gdb (crash diagnosis)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gdb

      - name: Version
        run: ./build/src/psdk/droppoint --version

      - name: Selftest (no link)
        shell: bash
        run: |
          set -euxo pipefail
          # Mirror what the .deb postinst does on a fresh install: the
          # credentials file (example values) must exist for the selftest.
          sudo mkdir -p /etc/droppoint
          sudo cp config/credentials.example.yaml /etc/droppoint/credentials.yaml
          # The widget-icon lookup expects <config dir>/../assets/widget —
          # stage the packaged layout with symlinks for both profiles.
          rc=0
          for profile in m4t m400; do
            stage=/tmp/dp-$profile
            mkdir -p "$stage"
            ln -sfn "$PWD/config/profiles/$profile" "$stage/config"
            ln -sfn "$PWD/assets" "$stage/assets"
            if ! ./build/src/psdk/droppoint --selftest --no-link --config "$stage/config"; then
              rc=1
              echo "::error::selftest failed for profile $profile — dumping log and re-running under gdb"
              cat ./data/logs/selftest.txt 2>/dev/null || true
              gdb -batch -ex run -ex bt --args \
                ./build/src/psdk/droppoint --selftest --no-link --config "$stage/config" || true
            fi
          done
          exit $rc

  package-arm64:
    runs-on: ubuntu-22.04-arm
    container:
      image: ubuntu:20.04
    steps:
      - name: Install build deps
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake g++ git python3 dpkg-dev ca-certificates

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone PSDK 3.16.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 3.16.0 \
            https://github.com/dji-sdk/Payload-SDK third_party/psdk

      # git describe refuses the container checkout ("dubious ownership")
      # without this — the build version would fall back to "unknown".
      - name: Allow git in container
        run: git config --global --add safe.directory '*'

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDROPPOINT_BUILD_PSDK=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .debs
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(sed -n 's/^project(droppoint VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          TAG="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || true)"
          # Debian versions must start with a digit: a bare commit hash does not.
          VERSION="${TAG:-${BASE:-0.2.0}+g$(git rev-parse --short HEAD)}"
          echo "version=$VERSION"
          for profile in m4t m400; do
            bash scripts/package.sh "$profile" "$VERSION" build dist
          done

      - name: Package m400 .dpk (packaging check only — dummy credentials)
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(sed -n 's/^project(droppoint VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          TAG="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || true)"
          # Debian versions must start with a digit: a bare commit hash does not.
          VERSION="${TAG:-${BASE:-0.2.0}+g$(git rev-parse --short HEAD)}"
          bash scripts/package_dpk.sh m400 build tests/data/credentials_test.yaml /tmp/dpk \
            third_party/psdk
          DPK="$(ls /tmp/dpk/DropPoint-M400_v*.dpk | head -1)"
          echo "dpk=$DPK"
          dpkg-deb -c "$DPK" | tee /tmp/dpk-listing.txt
          grep -q 'bin/droppoint' /tmp/dpk-listing.txt
          grep -q 'config/aircraft.yaml' /tmp/dpk-listing.txt
          echo "dpk packaging check passed (NOT uploaded — dummy credentials)"

      - name: Customer droppoint-make-dpk matches the developer path
        shell: bash
        run: |
          set -euo pipefail
          # the customer path: unpack the shipped m400 .deb, run the bundled
          # droppoint-make-dpk — exactly what the manual tells a customer to do
          mkdir -p /tmp/dp-unpack /tmp/dpk-ours
          dpkg-deb -x "$(ls dist/droppoint-m400_*_arm64.deb | head -1)" /tmp/dp-unpack/dp
          /tmp/dp-unpack/dp/opt/droppoint/bin/droppoint-make-dpk \
            --credentials tests/data/credentials_test.yaml --out /tmp/dpk-ours
          OURS="$(ls /tmp/dpk-ours/DropPoint-M400_v*.dpk | head -1)"
          DJI="$(ls /tmp/dpk/DropPoint-M400_v*.dpk | head -1)"
          echo "ours=$OURS"
          # identical control metadata and identical file lists (paths+modes
          # +sizes) — anything else means our builder diverged from DJI's tool
          diff <(dpkg-deb -f "$DJI") <(dpkg-deb -f "$OURS")
          diff <(dpkg-deb -c "$DJI" | awk '{print $1, $3, $NF}' | sort) \
               <(dpkg-deb -c "$OURS" | awk '{print $1, $3, $NF}' | sort)
          echo "make-dpk output is equivalent to build_dpk.sh (NOT uploaded)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: droppoint-packages
          path: dist/*.deb

  install-test-arm64:
    needs: package-arm64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: droppoint-packages
          path: dist

      - name: Install test per profile
        shell: bash
        run: |
          set -euo pipefail
          for profile in m4t m400; do
            DEB="$(ls dist/droppoint-${profile}_*_arm64.deb | head -1)"
            echo "=== install test: $profile ($DEB) ==="
            docker run --rm -v "$PWD/dist:/dist:ro" \
              -v "$PWD/tests/data/credentials_test.yaml:/creds/credentials_test.yaml:ro" \
              arm64v8/ubuntu:20.04 bash -xc "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              dpkg -i '/dist/$(basename $DEB)'
              /opt/droppoint/bin/droppoint --version
              /opt/droppoint/bin/droppoint --list-kits
              /opt/droppoint/bin/droppoint --selftest --no-link --config /opt/droppoint/config || {
                echo '::error::selftest failed — dumping report log if present'
                cat /var/log/droppoint/selftest.txt ./data/logs/selftest.txt 2>/dev/null || true
                exit 1
              }
              # the service runs as user 'droppoint' — the selftest must pass
              # without root; widget files are per-process so ownership of the
              # log dir must not matter for them
              runuser -u droppoint -- /opt/droppoint/bin/droppoint \
                --selftest --no-link --config /opt/droppoint/config | tee /tmp/st-$profile.log
              test \${PIPESTATUS[0]} -eq 0 || {
                echo '::error::non-root selftest failed — dumping report log'
                cat /var/log/droppoint/selftest.txt 2>/dev/null || true
                exit 1
              }
              grep -q '\[OK\] widget files generated' /tmp/st-$profile.log
              grep -q '\[INFO\] drop kit:' /tmp/st-$profile.log
              # m4t expects the SDK certified chip on /dev/i2c-1: in a
              # container with no I2C node the probe must exit 2 naming the
              # missing device node
              if [ $profile = m4t ]; then
                set +e
                /opt/droppoint/bin/droppoint --check-auth-chip \
                  --config /opt/droppoint/config > /tmp/chip.log 2>&1
                CHIP_RC=\$?
                set -e
                test \$CHIP_RC -eq 2
                grep -q 'device node' /tmp/chip.log
              fi
              # the report the ROOT run wrote must have been adopted into the
              # log dir's ownership — the service user can overwrite it
              runuser -u droppoint -- sh -c 'test -w /var/log/droppoint/selftest.txt'
              # alternating owners must keep working: root again, then the
              # service user again
              /opt/droppoint/bin/droppoint --selftest --no-link --config /opt/droppoint/config
              runuser -u droppoint -- /opt/droppoint/bin/droppoint \
                --selftest --no-link --config /opt/droppoint/config
              /opt/droppoint/bin/droppoint_sim_main --sim hover --profile /opt/droppoint/config | tee /tmp/sim-$profile.log
              test \${PIPESTATUS[0]} -eq 0
              grep -Eq 'SUMMARY.*fired=1' /tmp/sim-$profile.log || {
                echo '::error::hover sim did not fire for profile'
                cat /tmp/sim-$profile.log
                exit 1
              }
              # the Manifold 3 customer flow as an unprivileged user: unpack
              # the .deb, build the .dpk with the bundled tool, check it
              if [ $profile = m400 ]; then
                echo '=== make-dpk ==='
                useradd -m customer 2>/dev/null || true
                mkdir -p /tmp/mkdpk && chown customer /tmp/mkdpk
                cp "/dist/$(basename $DEB)" /tmp/mkdpk/
                runuser -u customer -- bash -c '
                  set -e
                  cd /tmp/mkdpk
                  dpkg-deb -x droppoint-m400_*.deb dp
                  dp/opt/droppoint/bin/droppoint-make-dpk \
                    --credentials /creds/credentials_test.yaml --out .
                  dpkg-deb -c DropPoint-M400_v*.dpk | tee listing.txt
                  grep -q "bin/droppoint" listing.txt
                  grep -q "config/aircraft.yaml" listing.txt
                  grep -q "config/credentials.yaml" listing.txt
                  grep -q "assets/widget/" listing.txt
                  if dp/opt/droppoint/bin/droppoint-make-dpk \
                      --credentials dp/opt/droppoint/config/credentials.example.yaml \
                      --out . 2>refuse.log; then
                    echo "make-dpk accepted placeholder credentials" >&2
                    exit 1
                  fi
                  grep -qi placeholder refuse.log
                '
                echo '=== end make-dpk ==='
              fi
              # upgrade-marker survival: site config edit, real credentials,
              # and the log dir must all survive a reinstall
              echo '# site edit marker' >> /opt/droppoint/config/payloads.yaml
              echo 'marker: survives' >> /etc/droppoint/credentials.yaml
              touch /var/log/droppoint/marker_file
              dpkg -i '/dist/$(basename $DEB)'
              grep -q 'site edit marker' /opt/droppoint/config/payloads.yaml
              grep -q 'marker: survives' /etc/droppoint/credentials.yaml
              test -f /var/log/droppoint/marker_file
              # removal: credentials + logs are site data, never removed
              dpkg -r droppoint-$profile
              test -f /etc/droppoint/credentials.yaml
              test -d /var/log/droppoint
              echo INSTALL TEST $profile PASSED
            " 2>&1 | tee "install-$profile.log"
            # host-side assertions: independent of the container's exit code,
            # so a mid-script death can never look like a pass
            grep -q "INSTALL TEST $profile PASSED" "install-$profile.log"
            grep -Eq 'SUMMARY.*fired=1' "install-$profile.log"
            grep -q 'drop kit:' "install-$profile.log"
            if grep -q '\[FAIL\]' "install-$profile.log"; then
              echo "::error::install log for $profile contains a [FAIL] line"
              exit 1
            fi
          done

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: install-*.log

  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: droppoint-packages
          path: dist

      - name: Attach .debs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber

  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every doc has a Status marker
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in docs/*.md; do
            if ! grep -q "Status:" "$f"; then
              echo "MISSING Status marker: $f"
              missing=1
            fi
          done
          exit $missing
